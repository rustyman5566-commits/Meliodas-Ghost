<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="East Customs logo">
  <defs>
    <linearGradient id="g1" x1="0" x2="1">
      <stop offset="0%" stop-color="#0BB6A0" />
      <stop offset="100%" stop-color="#1E90FF" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#0b6e61" flood-opacity="0.15"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <circle cx="512" cy="512" r="460" fill="url(#g1)" />
  </g>
  <!-- simple gear-like strokes (stylized) -->
  <g transform="translate(512,512) scale(0.8)" fill="none" stroke="#6ee0d0" stroke-width="18">
    <circle cx="0" cy="0" r="220" opacity="0.14" />
    <path d="M-250 -10 L-300 -40 M250 10 L300 40 M-10 -250 L-40 -300 M10 250 L40 300" stroke-linecap="round" stroke-width="28" opacity="0.25" />
  </g>
  <!-- wrench icon simplified -->
  <g transform="translate(490,540) rotate(-20) scale(0.7)" fill="none" stroke="#8fe9d9" stroke-width="22" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-180 -20 L-20 140"/>
    <path d="M-40 -60 C-10 -30, 30 -30, 60 -60 L90 -30 C60 0, 30 10, -10 50"/>
  </g>
  <!-- rotated text -->
  <g transform="translate(512,512) rotate(-18)">
    <text x="0" y="0" text-anchor="middle" font-family="Impact, Arial Black, sans-serif" font-size="80" fill="#032f6b" stroke="#00c36a" stroke-width="2" style="letter-spacing:6px">EAST CUSTOMS</text>
  </g>
</svg>
